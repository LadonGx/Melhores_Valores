version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: price_tracker_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: price_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: price_tracker_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: price_tracker_api
    command: uvicorn execution.web_server:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/price_tracker
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: price_tracker_worker
    command: celery -A execution.worker_tasks worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/price_tracker
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

  beat:
    build: .
    container_name: price_tracker_beat
    command: celery -A execution.worker_tasks beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/price_tracker
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: price_tracker_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: price_tracker_api
    command: uvicorn execution.web_server:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - MV_DATA_DIR=/app/.data
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis

  worker:
    build: .
    container_name: price_tracker_worker
    command: celery -A execution.worker_tasks worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    environment:
      - MV_DATA_DIR=/app/.data
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis

  beat:
    build: .
    container_name: price_tracker_beat
    command: celery -A execution.worker_tasks beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - MV_DATA_DIR=/app/.data
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis


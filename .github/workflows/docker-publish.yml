name: Docker images

# Publica as imagens da API e do front no GitHub Container Registry (ghcr.io)
# a cada push na main. Tags: "latest" e o SHA curto do commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: melhores-valores-api
            dockerfile: Dockerfile
          - image: melhores-valores-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Nome do dono em minúsculas (exigido pelo ghcr.io)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Teste de fumaça (só a API): constrói a imagem localmente (load, sem push) e roda sem rede.
      # Se o Node, o Prisma ou o Chromium não funcionarem, o job falha antes de publicar.
      # Sem cache-to aqui: o passo de publicar abaixo grava o cache e reaproveita este build.
      - name: Construir a imagem da API para o teste de fumaça
        if: matrix.image == 'melhores-valores-api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: mv-api:smoke
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Teste de fumaça da imagem da API (node, prisma e Chromium, sem rede)
        if: matrix.image == 'melhores-valores-api'
        run: |
          set -euo pipefail
          docker run --rm --network none -e FIRECRAWL_API_KEY= mv-api:smoke sh -c 'node --version && prisma --version'
          docker run --rm --network none -e FIRECRAWL_API_KEY= mv-api:smoke python -c "
          from playwright.sync_api import sync_playwright
          from execution.scrapers import playwright_scraper as ps
          with sync_playwright() as p:
              context, close = ps._open_disposable_context(p)
              page = context.new_page()
              page.goto('data:text/html,<title>ok</title>')
              assert page.title() == 'ok', 'Chromium não renderizou a página'
              close()
          print('browser.version =', ps._browser_version_cache)
          assert ps._browser_version_cache, 'browser.version vazio'
          "

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
